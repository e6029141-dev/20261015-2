<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPACE SHOOTER ver3.00</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="flex justify-between w-full">
            <div class="hud-text">SCORE: <span id="scoreDisplay">0</span></div>
            <div class="hud-text">STAGE <span id="stageDisplay">1</span></div>
        </div>
        <div class="flex justify-between w-full items-end">
            <div class="hud-text hp-text" id="hpDisplay">♥♥♥</div>
            <div class="hud-text text-sm" id="powerDisplay">POWER: 1</div>
        </div>
    </div>

    <div id="startScreen" class="overlay">
        <h1 class="text-5xl md:text-7xl font-black text-white mb-2 tracking-wider" style="text-shadow: 0 0 20px #3b82f6;">SPACE SHOOTER</h1>
        <p class="text-blue-300 mb-2 font-bold">ver 3.00</p>
        <p class="text-gray-400 text-sm mb-8 tracking-widest font-semibold">produced by HONDA</p>
        <button class="btn btn-secondary" onclick="openStageSelect()">STAGE SELECT</button>
        <button class="btn btn-secondary" onclick="openHighScores()">ハイスコアを見る</button>
        <button class="btn" onclick="startGame()">START GAME</button>
    </div>

    <div id="stageSelectScreen" class="overlay hidden">
        <h1 class="text-5xl font-black text-white mb-6 tracking-wider">SELECT STAGE</h1>
        <div id="stageOptions" class="stage-options"></div>
        <button class="btn btn-secondary" onclick="closeStageSelect()">BACK</button>
    </div>

    <div id="highScoreScreen" class="overlay hidden">
        <section class="record-panel">
            <h1 class="text-4xl font-black text-yellow-400 tracking-wider">HIGH SCORES</h1>
            <ol id="highScoreList" class="record-list"></ol>
            <button class="btn btn-secondary" onclick="closeHighScores()">トップへ戻る</button>
        </section>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
        <section id="recordEntry" class="record-panel">
            <h1 class="text-5xl font-black text-red-500 tracking-wider" style="text-shadow: 0 0 20px #ef4444;">GAME OVER</h1>
            <p class="text-white">RECORD YOUR RUN</p>
            <form id="recordForm" class="record-form">
                <label class="record-field">ステージ
                    <input id="recordStage" type="text" readonly>
                </label>
                <label class="record-field">ポイント
                    <input id="recordScore" type="text" readonly>
                </label>
                <label class="record-field">NAME (A-Z / 日本語)
                    <input id="recordName" type="text" maxlength="12" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" required>
                </label>
                <button class="btn" type="submit">SAVE RECORD</button>
            </form>
            <button class="btn btn-secondary" type="button" onclick="returnToTitle()">登録せずに戻る</button>
        </section>
        <section id="recordResult" class="record-panel hidden">
            <h1 class="text-4xl font-black text-yellow-400 tracking-wider">RECORD SAVED</h1>
            <p id="recordSavedSummary" class="text-white"></p>
            <h2 class="text-xl font-bold text-blue-300">TOP 10</h2>
            <ol id="recordList" class="record-list"></ol>
            <button class="btn" onclick="startGame()">RETRY</button>
            <button class="btn btn-secondary" onclick="returnToTitle()">BACK TO TITLE</button>
        </section>
    </div>
    
    <div id="stageClearScreen" class="overlay hidden bg-transparent">
        <h1 class="text-5xl font-black text-yellow-400 tracking-wider" style="text-shadow: 0 0 20px #eab308; animation: pulse 1s infinite;">STAGE CLEAR!</h1>
    </div>

    <script src="game.js"></script>
</body>
</html>
